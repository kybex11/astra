<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Astra Client Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo-box">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </div>
        <div class="logo-text">
          <h2>ASTRA</h2>
          <span>Web Dashboard</span>
        </div>
      </div>

      <nav class="nav-tabs" id="categoryTabs">
        <button class="tab-btn active" data-cat="COMBAT">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"></polyline>
              <line x1="13" y1="19" x2="19" y2="13"></line>
              <line x1="16" y1="16" x2="20" y2="20"></line>
              <line x1="19" y1="21" x2="21" y2="19"></line>
              <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"></polyline>
              <line x1="5" y1="14" x2="9" y2="18"></line>
              <line x1="7" y1="17" x2="4" y2="20"></line>
              <line x1="3" y1="19" x2="5" y2="21"></line>
            </svg>
          </span>
          <span>Combat</span>
        </button>

        <button class="tab-btn" data-cat="MOVEMENT">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </span>
          <span>Movement</span>
        </button>

        <button class="tab-btn" data-cat="RENDER">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </span>
          <span>Render</span>
        </button>

        <button class="tab-btn" data-cat="PLAYER">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <span>Player</span>
        </button>

        <button class="tab-btn" data-cat="HUD">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
          </span>
          <span>HUD</span>
        </button>

        <button class="tab-btn" data-cat="BUILD">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
            </svg>
          </span>
          <span>Build</span>
        </button>

        <button class="tab-btn" data-cat="MISC">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="21" x2="4" y2="14"></line>
              <line x1="4" y1="10" x2="4" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12" y2="3"></line>
              <line x1="20" y1="21" x2="20" y2="16"></line>
              <line x1="20" y1="12" x2="20" y2="3"></line>
              <line x1="1" y1="14" x2="7" y2="14"></line>
              <line x1="9" y1="8" x2="15" y2="8"></line>
              <line x1="17" y1="16" x2="23" y2="16"></line>
            </svg>
          </span>
          <span>Misc</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="status-indicator">
          <div class="status-dot"></div>
          <span id="bridgeStatusText">Live Bridge Active</span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="content-panel">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="search-bar">
          <span class="search-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input type="text" id="searchInput" placeholder="Поиск модулей (KillAura, Aim, ESP, Fly...)...">
        </div>

        <div class="filter-chips">
          <button class="chip active" data-filter="all">Все</button>
          <button class="chip" data-filter="enabled">Включенные</button>
          <button class="chip" data-filter="settings">С настройками</button>
        </div>

        <div class="top-actions">
          <div class="theme-picker" id="themePicker">
            <span class="theme-dot indigo active" data-theme="Indigo" title="Indigo"></span>
            <span class="theme-dot cyan" data-theme="Cyan" title="Cyan"></span>
            <span class="theme-dot emerald" data-theme="Emerald" title="Emerald"></span>
            <span class="theme-dot crimson" data-theme="Crimson" title="Crimson"></span>
            <span class="theme-dot sunset" data-theme="Sunset" title="Sunset"></span>
          </div>
          <button class="close-btn" id="closeBtn" title="Закрыть">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Modules Grid -->
      <section class="modules-container">
        <div class="category-header">
          <div class="title-with-badge">
            <h1 id="currentCatTitle">Combat</h1>
            <span class="badge" id="moduleCountBadge">0 модулей</span>
          </div>
          <div class="quick-stats" id="quickStats">
            <span>Активно: <b id="activeCount">0</b></span>
          </div>
        </div>

        <div class="modules-grid" id="modulesGrid">
          <!-- Populated dynamically by app.js -->
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
